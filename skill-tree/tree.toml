# Track: probability (Blitzstein & Hwang)
# =====================================================================================

[[node]]
id = "probability-01-counting-conditioning"
title = "Counting, conditional probability, Bayes"
track = "probability"
requires = []
sources = ["blitzstein:1", "blitzstein:2"]
deliverable = "math/probability/01-counting-conditioning"
build = [
  "exact probabilities by counting, checked by simulation",
