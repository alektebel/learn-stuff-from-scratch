  "importance-sampling estimates are unbiased across repeated runs",
  "HMC has a higher effective sample size per gradient than random-walk MH on a correlated Gaussian",
]
limit_cases = ["importance sampling with a proposal lighter-tailed than the target: infinite variance"]
status = "done"

[[node]]
