[[node]]
id = "probability-05-limits-inequalities"
title = "Transformations, inequalities, limit theorems"
track = "probability"
requires = ["probability-04-joint"]
sources = ["blitzstein:8", "blitzstein:10"]
deliverable = "math/probability/05-limits-inequalities"
build = [
  "change of variables and convolutions",
  "Markov, Chebyshev, Chernoff bounds compared with exact tails",
  "law of large numbers and CLT by simulation",
]
accept = [
  "every bound is above the exact tail probability on all tested points",
  "the CLT approximation error shrinks as 1/sqrt(n) (Berry-Esseen order)",
]
limit_cases = ["the Cauchy distribution: the sample mean does not converge"]
status = "done"

[[node]]
id = "probability-06-conditional-expectation"
title = "Conditional expectation"
track = "probability"
requires = ["probability-04-joint"]
sources = ["blitzstein:9"]
deliverable = "math/probability/06-conditional-expectation"
build = ["Adam's law and Eve's law, verified by simulation", "E[Y|X] as the best predictor in squared error"]
accept = ["E[Y|X] beats every other tested function of X in mean squared error"]
limit_cases = ["a hierarchical model where the naive variance ignores Var(E[Y|X])"]
status = "done"

[[node]]
id = "probability-07-markov-chains-mcmc"
title = "Markov chains and MCMC"
track = "probability"
requires = ["probability-06-conditional-expectation"]
sources = ["blitzstein:11", "blitzstein:12"]
deliverable = "math/probability/07-markov-chains-mcmc"
build = [
  "stationary distribution by eigenvector and by simulation",
  "Metropolis-Hastings and Gibbs sampling",
]
accept = [
  "the empirical distribution of a long chain matches the stationary distribution",
  "Metropolis-Hastings recovers a known target's mean and variance",
]
limit_cases = [
  "a periodic chain that has a stationary distribution but does not converge to it",
  "a bimodal target where a small-step sampler never crosses between modes",
]
