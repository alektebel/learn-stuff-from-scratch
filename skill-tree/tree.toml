]
accept = [
  "inverse-CDF samples pass a Kolmogorov-Smirnov test against the target",
]
limit_cases = ["inverse-CDF sampling of a heavy tail where float precision near u = 1 truncates the tail"]
status = "done"

[[node]]
id = "probability-04-joint"
title = "Joint distributions and covariance"
track = "probability"
requires = ["probability-03-continuous"]
sources = ["blitzstein:7"]
deliverable = "math/probability/04-joint"
build = [
  "joint, marginal and conditional distributions; covariance and correlation",
  "multinomial and bivariate normal",
]
accept = ["sample covariance matrices converge to the analytic ones"]
limit_cases = ["uncorrelated but dependent variables (X and X^2 with X symmetric)"]
