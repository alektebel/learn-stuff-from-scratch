[[node]]
id = "cloud-01-object-store"
title = "An object store (S3-shaped)"
track = "cloud"
difficulty = 3
requires = []
sources = ["awsdocs:s3"]
deliverable = "cloud/01-object-store"
build = [
  "buckets and keys with put/get/delete and list by prefix",
  "object versioning and delete markers",
  "an ETag, and a presigned-style capability token",
]
accept = [
  "CRUD works and list honours prefix and delimiter",
  "versioning keeps every version and a delete marker hides the current one",
  "the ETag is a hash of the content and changes when the content does",
]
limit_cases = [
  "deleting a non-empty bucket is refused, not silently destructive",
  "a read-after-write of a just-put key sees it (the model is not eventually consistent)",
]
status = "done"

[[node]]
id = "cloud-02-iam-policy"
title = "An IAM policy evaluator"
track = "cloud"
difficulty = 4
requires = []
sources = ["awsiam:evaluation"]
deliverable = "cloud/02-iam-policy"
build = [
  "parse a policy document (Statement, Effect, Action, Resource, Condition)",
  "evaluate Allow/Deny with wildcards, explicit deny winning",
  "an implicit-deny default and a condition evaluator",
]
accept = [
  "evaluation matches the documented order: explicit deny, then allow, else deny",
  "action and resource wildcards match the intended set",
  "conditions gate a statement on request context",
]
limit_cases = [
  "an explicit Deny beats an Allow no matter how many Allows exist",
  "a missing action is an implicit deny, not an error",
]
status = "done"

[[node]]
id = "cloud-03-queue-fanout"
title = "A queue and pub/sub (SQS + SNS-shaped)"
track = "cloud"
difficulty = 3
requires = ["cloud-01-object-store"]
sources = ["awsdocs:sqs", "awsdocs:sns"]
deliverable = "cloud/03-queue-fanout"
build = [
  "a queue with visibility timeout and at-least-once redelivery",
  "acknowledgement that removes a message",
  "a topic fanning out to subscribers (queue or webhook)",
]
accept = [
  "an unacknowledged message reappears after the visibility timeout",
  "an acknowledged message is gone for good",
  "a publish reaches every subscriber",
]
limit_cases = [
  "at-least-once means duplicates; a consumer must be idempotent to survive them",
  "after max receives, the message goes to a dead-letter queue",
]
status = "done"

[[node]]
id = "cloud-04-vpc-routing"
title = "A VPC: routes, security groups, NACLs"
track = "cloud"
difficulty = 4
requires = ["cloud-01-object-store"]
sources = ["awsdocs:vpc"]
deliverable = "cloud/04-vpc-routing"
build = [
  "a route table with longest-prefix-match lookup",
  "stateful security groups (return traffic allowed) and a stateless NACL",
  "a packet simulator that walks the decision"
]
accept = [
  "the most specific matching prefix wins",
  "a security-group rule allows the response without an explicit inbound rule",
  "a NACL must allow both directions and the ephemeral ports"
]
limit_cases = [
  "overlapping prefixes: the longest match beats the default route",
  "a NACL that blocks the ephemeral return port kills an otherwise-allowed connection",
]
status = "done"

[[node]]
id = "cloud-05-iac-drift"
title = "Infra as code and drift"
track = "cloud"
difficulty = 3
kind = "capstone"
requires = ["cloud-02-iam-policy", "cloud-04-vpc-routing"]
sources = ["awsdocs:cloudformation"]
deliverable = "cloud/05-iac-drift"
build = [
  "parse a declarative resource spec and a current-state document",
  "compute a plan of create/update/delete actions",
  "order actions by dependency"
]
accept = [
  "with state equal to spec the plan is empty (idempotent)",
  "a changed attribute produces an update, a removed resource a delete",
  "creates precede dependents; deletes follow them"
]
limit_cases = [
  "a rename is create-before-destroy, not destroy-before-create, for a stateful resource",
  "a cycle in the dependency graph is reported, not looped on",
]
status = "done"

