# The math / pattern-recognition skill tree.
#
# One [[node]] per skill. A node is READY when every node in `requires` is "done".
# `python3 tree.py next` lists ready nodes; `python3 tree.py check` validates this file.
#
# Fields
#   id           unique, "<track>-<nn>-<slug>"
#   title        short name
#   track        foundations | linalg | probability | optimization | prml | lean
#   requires     ids that must be done first (the edges of the tree)
#   sources      "book:chapter" or "book:chapter.section", books defined in books.toml
#   deliverable  directory the module is built in (graded-module format)
#   build        what the learner implements, one item per function group
#   accept       checks check.py must contain: concrete, numerically verifiable
#   limit_cases  the cases that break a naive version; each needs its own check
#   related      existing repo directories that touch the same idea
#   status       todo | in-progress | done | exists
#                (exists = material already in the repo without graded checks)
#
# Every derivation is verified numerically (finite differences, Monte Carlo, or a
# closed form checked against simulation). A derivation that is only written down is
# not done.

# =====================================================================================
# Track: foundations (Mathematics for Machine Learning)
# =====================================================================================

[[node]]
id = "foundations-01-linear-algebra"
title = "Vectors, matrices, linear systems"
track = "foundations"
requires = []
sources = ["mml:2"]
deliverable = "math/foundations/01-linear-algebra"
build = [
  "Gaussian elimination with partial pivoting to row echelon form",
  "solve Ax = b, rank, null space basis, particular + homogeneous solution",
  "matrix inverse via Gauss-Jordan; determinant from the elimination",
]
accept = [
  "solutions match numpy.linalg.solve on 200 random well-conditioned systems",
  "null space vectors satisfy A n = 0 and the basis size equals n - rank",
  "an inconsistent system is reported as inconsistent, not solved",
]
limit_cases = [
  "a zero pivot that partial pivoting must swap around",
  "singular matrix: rank-deficient, inverse must raise",
  "a matrix where no pivoting gives catastrophic error (small pivot) and pivoting does not",
]
status = "done"

[[node]]
id = "foundations-02-analytic-geometry"
title = "Norms, inner products, projections, rotations"
track = "foundations"
requires = ["foundations-01-linear-algebra"]
sources = ["mml:3"]
deliverable = "math/foundations/02-analytic-geometry"
build = [
  "inner product from a symmetric positive definite matrix; induced norm and angle",
  "orthogonal projection onto a subspace (projection matrix) and onto an affine subspace",
  "Gram-Schmidt orthonormalisation",
  "2-D and 3-D rotation matrices",
]
accept = [
  "projection P is idempotent (P^2 = P) and symmetric, and the residual is orthogonal to the subspace",
  "Gram-Schmidt output Q satisfies Q^T Q = I to 1e-10",
  "rotations preserve norms and have determinant +1",
]
limit_cases = [
  "classical Gram-Schmidt losing orthogonality on nearly dependent vectors; modified Gram-Schmidt keeping it (measure ||Q^T Q - I||)",
  "a non-SPD matrix rejected as an inner product",
]
status = "done"

[[node]]
id = "foundations-03-matrix-decompositions"
title = "Eigendecomposition, Cholesky, SVD"
track = "foundations"
requires = ["foundations-02-analytic-geometry"]
sources = ["mml:4"]
deliverable = "math/foundations/03-matrix-decompositions"
build = [
  "power iteration and deflation for the dominant eigenpairs",
  "Cholesky decomposition",
  "SVD from the eigendecomposition of A^T A, and low-rank approximation",
]
accept = [
  "Cholesky L L^T reconstructs A to 1e-10 for random SPD matrices",
  "rank-k approximation error equals the (k+1)-th singular value in spectral norm (Eckart-Young)",
  "eigenpairs satisfy A v = lambda v",
]
limit_cases = [
  "Cholesky on a non-SPD matrix must raise, not return NaN",
  "power iteration with two eigenvalues of equal magnitude (no convergence): detect it",
  "SVD via A^T A squaring the condition number: show the precision loss against numpy.linalg.svd",
]
status = "done"

[[node]]
id = "foundations-04-vector-calculus"
title = "Gradients, Jacobians, chain rule, backpropagation"
track = "foundations"
requires = ["foundations-01-linear-algebra"]
sources = ["mml:5"]
deliverable = "math/foundations/04-vector-calculus"
build = [
  "analytic gradients of standard matrix expressions (x^T A x, ||Ax - b||^2, log det, trace forms)",
  "a finite-difference checker (central differences) used by every later node",
  "Taylor expansion to second order with the Hessian",
]
accept = [
  "every analytic gradient matches central differences to relative error 1e-6",
  "second-order Taylor error shrinks as h^3",
]
limit_cases = [
  "finite differences with h too small (round-off dominates): show the U-shaped error curve over h",
  "gradient of x^T A x with non-symmetric A is (A + A^T) x, not 2 A x",
]
related = ["ml-systems/framework"]
status = "done"

[[node]]
id = "foundations-05-probability"
title = "Probability and distributions for ML"
track = "foundations"
requires = ["foundations-04-vector-calculus"]
sources = ["mml:6"]
deliverable = "math/foundations/05-probability"
build = [
  "multivariate Gaussian: density, sampling via Cholesky, marginals and conditionals",
  "product of Gaussians, linear transformation of a Gaussian",
  "change of variables for densities",
]
accept = [
  "sampled mean and covariance match the parameters (Monte Carlo, tolerance from the CLT)",
  "conditional mean and covariance of a 2-block Gaussian match regression on samples",
  "a transformed density integrates to 1 numerically",
]
limit_cases = [
  "a nearly singular covariance: log density computed via Cholesky, not via inverse and det",
  "change of variables forgetting the Jacobian term: the density no longer integrates to 1",
]
status = "done"

[[node]]
id = "foundations-06-optimization"
title = "Continuous optimisation"
track = "foundations"
requires = ["foundations-04-vector-calculus", "foundations-03-matrix-decompositions"]
sources = ["mml:7"]
deliverable = "math/foundations/06-optimization"
build = [
  "gradient descent with fixed step and with backtracking line search",
  "momentum",
  "Lagrange multipliers for an equality-constrained quadratic",
]
accept = [
  "on a quadratic, the number of iterations grows with the condition number as predicted",
  "the constrained optimum satisfies the KKT conditions to 1e-8",
]
limit_cases = [
  "step size above 2 / L diverges; just below converges (L = largest Hessian eigenvalue)",
  "an ill-conditioned valley where plain GD zig-zags and momentum does not",
]
status = "done"

# =====================================================================================
# Track: linear algebra (Axler; Trefethen & Bau)
# =====================================================================================

[[node]]
id = "linalg-01-vector-spaces"
title = "Vector spaces and linear maps"
track = "linalg"
requires = ["foundations-01-linear-algebra"]
sources = ["axler:1", "axler:2", "axler:3"]
deliverable = "math/linalg/01-vector-spaces"
build = [
  "polynomial spaces P_n as coordinate vectors; the differentiation map as a matrix",
  "change of basis; matrix of a linear map in two bases",
  "fundamental theorem of linear maps: dim V = dim null T + dim range T, checked on random maps",
]
accept = [
  "the matrix of a map changes by S^-1 A S under a change of basis, verified on random bases",
  "rank-nullity holds for 100 random maps between spaces of different dimension",
]
limit_cases = ["the differentiation map on P_n is nilpotent: its matrix to the power n+1 is zero"]
status = "done"

[[node]]
id = "linalg-02-eigenvalues"
title = "Eigenvalues, invariant subspaces, diagonalisability"
track = "linalg"
requires = ["linalg-01-vector-spaces"]
sources = ["axler:5"]
deliverable = "math/linalg/02-eigenvalues"
build = [
  "characteristic polynomial and its roots (small n) versus numerical eigenvalues",
  "test for diagonalisability; Jordan-block example",
]
accept = [
  "a matrix is diagonalisable iff it has n independent eigenvectors, checked on constructed examples",
]
limit_cases = [
  "a defective matrix (Jordan block) where numerical eigenvectors are nearly parallel",
  "root-finding of the characteristic polynomial losing accuracy (Wilkinson's polynomial) versus a QR-based eigensolver",
]
status = "done"

[[node]]
id = "linalg-03-spectral-theorem"
title = "Inner product spaces and the spectral theorem"
track = "linalg"
requires = ["linalg-02-eigenvalues", "foundations-02-analytic-geometry"]
sources = ["axler:6", "axler:7"]
deliverable = "math/linalg/03-spectral-theorem"
build = [
  "orthonormal eigenbasis of a symmetric matrix",
  "positive operators and square roots; polar decomposition",
  "singular value decomposition from the spectral theorem",
]
accept = [
  "eigenvectors of a symmetric matrix are orthonormal to 1e-10",
  "polar decomposition A = Q P with Q orthogonal and P positive semidefinite",
]
limit_cases = ["a symmetric matrix with a repeated eigenvalue: any basis of the eigenspace is valid; the check must not assume a specific one"]
related = ["spectral-graphs"]
status = "done"

[[node]]
id = "linalg-04-qr-least-squares"
title = "QR factorisation and least squares"
track = "linalg"
requires = ["linalg-03-spectral-theorem"]
sources = ["trefethen:lecture6", "trefethen:lecture7", "trefethen:lecture8", "trefethen:lecture10", "trefethen:lecture11"]
deliverable = "math/linalg/04-qr-least-squares"
build = [
  "Householder QR",
  "least squares three ways: normal equations, QR, SVD",
]
accept = [
  "Householder Q is orthogonal to machine precision even for ill-conditioned A",
  "the three least-squares methods agree on well-conditioned problems",
]
limit_cases = [
  "an ill-conditioned problem where the normal equations lose about twice as many digits as QR (measure against a high-precision reference)",
]
status = "todo"

[[node]]
id = "linalg-05-conditioning-stability"
title = "Conditioning and numerical stability"
track = "linalg"
requires = ["linalg-04-qr-least-squares"]
sources = ["trefethen:lecture12", "trefethen:lecture13", "trefethen:lecture14", "trefethen:lecture15", "trefethen:lecture20", "trefethen:lecture21"]
deliverable = "math/linalg/05-conditioning-stability"
build = [
  "condition numbers of problems versus stability of algorithms",
  "LU without pivoting versus with partial pivoting; growth factor",
]
accept = [
  "forward error is bounded by condition number times backward error on 100 random problems",
]
limit_cases = [
  "a matrix where LU without pivoting is unstable and with pivoting is fine",
  "the classic matrix with growth factor 2^(n-1) under partial pivoting",
]
status = "todo"

[[node]]
id = "linalg-06-eigenvalue-algorithms"
title = "Eigenvalue algorithms"
track = "linalg"
requires = ["linalg-05-conditioning-stability", "linalg-02-eigenvalues"]
sources = ["trefethen:lecture25", "trefethen:lecture26", "trefethen:lecture27", "trefethen:lecture28", "trefethen:lecture29"]
deliverable = "math/linalg/06-eigenvalue-algorithms"
build = [
  "reduction to Hessenberg / tridiagonal form",
  "Rayleigh quotient iteration",
  "unshifted and shifted QR algorithm",
]
accept = [
  "eigenvalues match numpy.linalg.eigvalsh on random symmetric matrices to 1e-10",
  "Rayleigh quotient iteration converges cubically (measure the error sequence)",
]
limit_cases = ["unshifted QR stalling on eigenvalues of equal magnitude; Wilkinson shift fixing it"]
related = ["spectral-graphs"]
status = "todo"

