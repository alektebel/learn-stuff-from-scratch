# =====================================================================================
# Track: lowlevel (systems programming: representation, memory, the OS boundary)
# =====================================================================================

[[node]]
id = "lowlevel-01-bit-representation"
title = "Bits: integers, floats, endianness"
track = "lowlevel"
difficulty = 2
requires = []
sources = ["csapp:2"]
deliverable = "lowlevel/01-bit-representation"
build = [
  "encode and decode two's-complement integers of any width",
  "encode and decode IEEE-754 binary32/binary64 with struct",
  "byte order: little/big endian, and a host-order detector",
]
accept = [
  "round-trips agree with struct.pack/unpack on random bit patterns",
  "hex dump of known values matches the reference (0xFFFFFFFF = -1 in i32)",
  "-0.0, +inf and NaN survive a round-trip with their sign and payload class",
]
limit_cases = [
  "a denormal float is not flushed to zero",
  "integer overflow wraps, it does not raise, and is flagged by a separate guarded add",
]
status = "done"

[[node]]
id = "lowlevel-02-memory-layout"
title = "Struct layout, alignment, padding"
track = "lowlevel"
difficulty = 3
requires = ["lowlevel-01-bit-representation"]
sources = ["csapp:3"]
deliverable = "lowlevel/02-memory-layout"
build = [
  "sizeof and member offsets for a struct under natural alignment",
  "a packer that lays out a struct as a byte string",
  "reordering fields to shrink a struct",
]
accept = [
  "sizeof and offsets match struct.calcsize and struct field offsets",
  "packed layout matches a hand-written format string",
  "reordering strictly reduces size when padding exists",
]
limit_cases = [
  "a packed (unaligned) struct is smaller but the unaligned access is flagged",
  "an over-aligned member pads the whole struct, not just the member",
]
status = "done"

[[node]]
id = "lowlevel-03-allocator"
title = "A malloc: free list, split, coalesce"
track = "lowlevel"
difficulty = 4
requires = ["lowlevel-02-memory-layout"]
sources = ["csapp:9"]
deliverable = "lowlevel/03-allocator"
build = [
  "allocate/free over a fixed arena with 16-byte alignment",
  "free-list search (first fit), block split and neighbour coalescing",
  "a utilisation metric (payload bytes over arena bytes)",
]
accept = [
  "every returned pointer is 16-byte aligned and non-overlapping",
  "freed blocks are reused and adjacent free blocks coalesce",
  "a stress run keeps utilisation above a stated floor",
]
limit_cases = [
  "free(NULL) is a no-op; a double free is detected, not silently corrupting the list",
  "fragmentation: alternating alloc/free leaves no falsely-large free block",
]
status = "done"

[[node]]
id = "lowlevel-04-syscalls-io"
title = "File descriptors, read/write, buffering"
track = "lowlevel"
difficulty = 3
requires = ["lowlevel-02-memory-layout"]
sources = ["ostep:36", "posix:2"]
deliverable = "lowlevel/04-syscalls-io"
build = [
  "copy a file with os.read/os.write and no buffering",
  "a buffered reader that handles short reads",
  "an fd table mapping small integers to open handles",
]
accept = [
  "the copy is byte-identical to the source on random data",
  "a deliberately short read is looped until EOF, not truncated",
  "closing an fd twice is reported, not ignored",
]
limit_cases = [
  "a partial write on a pipe is retried for the remainder",
  "read returning 0 means EOF, not an error to retry",
]
status = "done"

[[node]]
id = "lowlevel-05-concurrency"
title = "Locks, atomics, condition variables"
track = "lowlevel"
difficulty = 4
requires = ["lowlevel-03-allocator"]
sources = ["ostep:28", "ostep:29"]
deliverable = "lowlevel/05-concurrency"
build = [
  "a spinlock from an atomic test-and-set and a compare-and-swap",
  "a bounded queue with a mutex and condition variables (producer/consumer)",
  "a shared counter incremented with and without the lock",
]
accept = [
  "the unsynchronised counter loses updates; the locked one does not",
  "no item is lost or duplicated across many producers and consumers",
  "the spinlock is not held across a blocking call",
]
limit_cases = [
  "a lost wake-up when the condition is checked with if instead of while",
  "deadlock when two threads take locks in opposite order, surfaced by a timeout",
]
status = "done"

# =====================================================================================
# Track: distributed (replication, consensus, convergence, partitioning)
# =====================================================================================

[[node]]
id = "distributed-01-clocks"
title = "Time, Lamport and vector clocks"
track = "distributed"
difficulty = 3
requires = []
sources = ["ddia:8", "vansteen:6"]
deliverable = "distributed/01-clocks"
build = [
  "a Lamport clock over a simulated message stream",
  "a vector clock and the happens-before relation",
  "classify two events: before, after, or concurrent",
]
accept = [
  "causal order is preserved (a send precedes its receive everywhere)",
  "concurrent events are reported concurrent, never ordered",
  "clocks merge correctly when a message is received",
]
limit_cases = [
  "clock skew: two unsynchronised wall clocks can disagree with the causal order",
  "an empty vector clock vs a populated one is handled, not crashed",
]
status = "done"

[[node]]
id = "distributed-02-replication-quorums"
title = "Replication and quorums"
track = "distributed"
difficulty = 3
requires = ["distributed-01-clocks"]
sources = ["ddia:5"]
deliverable = "distributed/02-replication-quorums"
build = [
  "a single-leader log replicated to followers over a simulated network",
  "quorum reads and writes with parameters R, W and N",
  "a read-after-write check under the quorum rule",
]
accept = [
  "with R + W > N a read sees the last acknowledged write",
  "with R + W <= N a stale read is possible and is demonstrated",
  "a write acknowledged to the client is durable on a quorum",
]
limit_cases = [
  "under a partition, a minority refuses the write instead of forking the log",
  "a slow follower lags but does not block the quorum",
]
status = "done"

[[node]]
id = "distributed-03-consensus"
title = "Consensus (Raft): elect, replicate, commit"
track = "distributed"
difficulty = 5
kind = "capstone"
requires = ["distributed-02-replication-quorums"]
sources = ["raft:5", "vansteen:8"]
deliverable = "distributed/03-consensus"
build = [
  "leader election with terms and a randomised timeout",
  "log replication and the commitment rule (majority match)",
  "an apply channel that delivers committed entries in order",
]
accept = [
  "at most one leader per term; a new election after a leader crash",
  "two nodes never apply different entries at the same index",
  "a minority cannot commit anything",
]
limit_cases = [
  "a partitioned leader rejoins and steps down without diverging the log",
  "delayed and reordered messages do not break safety",
]
status = "done"

[[node]]
id = "distributed-04-crdts"
title = "CRDTs: counters, registers, sets"
track = "distributed"
difficulty = 4
requires = ["distributed-01-clocks"]
sources = ["vansteen:7"]
deliverable = "distributed/04-crdts"
build = [
  "a grow-only counter and a two-phase (PN) counter",
  "last-writer-wins register with a total order tie-break",
  "an observed-remove set (OR-set)",
]
accept = [
  "merge is commutative, associative and idempotent (proved by fuzzing)",
  "replicas converge after an arbitrary exchange of merges",
  "the PN counter can go down and the OR-set can re-add a removed element",
]
limit_cases = [
  "OR-set: remove-then-add keeps the element, add-then-remove drops it",
  "LWW ties are broken by node id, deterministically",
]
status = "done"

[[node]]
id = "distributed-05-partitioning"
title = "Partitioning and rebalancing"
track = "distributed"
difficulty = 3
requires = ["distributed-02-replication-quorums"]
sources = ["ddia:6"]
deliverable = "distributed/05-partitioning"
build = [
  "a consistent-hashing ring with virtual nodes",
  "key-to-node assignment and rebalancing on join/leave",
  "an evenness metric across nodes",
]
accept = [
  "keys distribute within a stated bound of even with enough virtual nodes",
  "when one node joins, only its share of keys moves, not all of them",
  "a lookup returns the same node for the same key before and after a read-only op",
]
limit_cases = [
  "a hot key overloads one node even with a balanced ring",
  "too few virtual nodes gives a badly uneven ring",
]
status = "done"

