# =====================================================================================
# Track: optimisation (Boyd & Vandenberghe)
# =====================================================================================

[[node]]
id = "optimization-01-convexity"
title = "Convex sets and convex functions"
track = "optimization"
requires = ["foundations-06-optimization"]
sources = ["boyd:2", "boyd:3"]
deliverable = "math/optimization/01-convexity"
build = ["numerical convexity tests (Jensen on random points, PSD Hessian)", "operations that preserve convexity"]
accept = ["the tests classify a catalogue of functions correctly, including log-sum-exp and the geometric mean"]
limit_cases = ["a quasiconvex but non-convex function that passes a naive sublevel-set test"]
status = "done"

[[node]]
id = "optimization-02-duality"
title = "Lagrangian duality and KKT"
track = "optimization"
requires = ["optimization-01-convexity"]
sources = ["boyd:5"]
deliverable = "math/optimization/02-duality"
build = ["dual of a QP and an LP", "KKT conditions checker", "weak and strong duality, numerically"]
accept = ["dual value <= primal value always; equal when Slater's condition holds"]
limit_cases = ["a problem without Slater's condition and a positive duality gap"]
status = "done"

[[node]]
id = "optimization-03-unconstrained"
title = "Unconstrained minimisation: gradient and Newton"
track = "optimization"
requires = ["optimization-01-convexity", "linalg-05-conditioning-stability"]
sources = ["boyd:9"]
deliverable = "math/optimization/03-unconstrained"
build = ["gradient descent with backtracking", "Newton's method with the Newton decrement as stopping criterion"]
accept = ["Newton converges quadratically near the optimum (digits double per iteration)"]
limit_cases = ["Newton without line search diverging from a far start; damped Newton converging"]
status = "done"

[[node]]
id = "optimization-04-interior-point"
title = "Equality constraints and interior-point methods"
track = "optimization"
requires = ["optimization-02-duality", "optimization-03-unconstrained"]
sources = ["boyd:10", "boyd:11"]
deliverable = "math/optimization/04-interior-point"
build = ["equality-constrained Newton", "log-barrier method for an inequality-constrained LP"]
accept = ["the barrier method's duality gap follows m / t", "solutions match a simplex reference on random LPs"]
limit_cases = ["an infeasible LP detected by a phase-I method"]
status = "done"

# =====================================================================================
# Track: pattern recognition (Bishop, PRML)
# =====================================================================================

[[node]]
id = "prml-01-introduction"
title = "Curve fitting, bias-variance, decision and information theory"
track = "prml"
requires = ["foundations-05-probability", "probability-03-continuous"]
sources = ["bishop:1", "murphy1:4"]
deliverable = "math/prml/01-introduction"
build = [
  "polynomial curve fitting by least squares and with an L2 penalty",
  "bias-variance decomposition by simulation over many training sets",
  "decision theory: minimum-risk decisions with a loss matrix; entropy, KL divergence, mutual information",
]
accept = [
  "the simulated bias^2 + variance + noise equals the expected test error",
  "KL divergence is non-negative and zero only for equal distributions",
]
limit_cases = [
  "degree-9 polynomial on 10 points: zero training error, huge test error; regularisation fixing it",
  "an asymmetric loss matrix that moves the decision boundary away from p = 0.5",
]
status = "done"

[[node]]
id = "prml-02-distributions"
title = "Probability distributions and conjugacy"
track = "prml"
requires = ["prml-01-introduction", "probability-04-joint"]
sources = ["bishop:2", "murphy1:3"]
deliverable = "math/prml/02-distributions"
build = [
  "Beta-Bernoulli and Dirichlet-multinomial posterior updates",
  "Gaussian: MLE, sequential estimation, conjugate prior for the mean",
  "exponential family form and sufficient statistics",
  "nonparametric density estimation: histogram, kernel density, k-nearest neighbours",
]
accept = [
  "sequential and batch posterior updates give identical posteriors",
  "the MLE of the variance is biased by (N-1)/N, shown by simulation",
]
limit_cases = [
  "MLE of a Bernoulli after 3 heads in 3 tosses (p = 1) versus the Beta posterior mean",
  "KDE bandwidth too small and too large: the two failure modes",
]
status = "done"

[[node]]
id = "prml-03-linear-regression"
title = "Linear models for regression"
track = "prml"
requires = ["prml-02-distributions", "foundations-03-matrix-decompositions"]
sources = ["bishop:3", "mml:9"]
deliverable = "math/prml/03-linear-regression"
build = [
  "basis-function regression; MLE and regularised least squares",
  "Bayesian linear regression: posterior over weights, predictive distribution",
  "evidence approximation to choose alpha and beta",
]
accept = [
  "the predictive variance grows away from the training data",
  "evidence maximisation picks a model complexity close to the true one on synthetic data",
]
limit_cases = ["more basis functions than data points: MLE ill-posed, Bayesian posterior well defined"]
status = "done"

[[node]]
id = "prml-04-linear-classification"
title = "Linear models for classification"
track = "prml"
requires = ["prml-03-linear-regression", "foundations-06-optimization"]
sources = ["bishop:4"]
deliverable = "math/prml/04-linear-classification"
build = [
  "least-squares classification, Fisher's linear discriminant, the perceptron",
  "logistic regression trained by IRLS (Newton)",
  "Laplace approximation for Bayesian logistic regression",
]
accept = [
  "IRLS converges in far fewer iterations than gradient descent on the same problem",
  "the Laplace approximation's mean equals the MAP estimate",
]
limit_cases = [
  "linearly separable data: the logistic MLE diverges (weights grow without bound); a prior keeps it finite",
  "least-squares classification ruined by outliers that logistic regression ignores",
]
related = ["ml-systems/framework"]
status = "done"

[[node]]
id = "prml-05-neural-networks"
title = "Neural networks: backprop, Hessian, regularisation"
track = "prml"
requires = ["prml-04-linear-classification", "foundations-04-vector-calculus"]
sources = ["bishop:5"]
deliverable = "math/prml/05-neural-networks"
build = [
  "backpropagation derived by hand for a 2-layer network, checked by finite differences",
  "exact Hessian by finite differences of gradients; outer-product approximation",
  "weight decay and early stopping",
]
accept = [
  "the outer-product Hessian approximation matches the exact one near a minimum with small residuals",
