build = [
  "PMFs and CDFs of Bernoulli, Binomial, Geometric, Negative Binomial, Poisson",
  "linearity of expectation and indicator random variables",
]
accept = [
  "means and variances match simulation; Poisson approximation error to the Binomial shrinks as predicted",
]
limit_cases = ["an expectation computed with indicators where the variables are dependent (linearity still holds)"]
status = "done"

[[node]]
id = "probability-03-continuous"
