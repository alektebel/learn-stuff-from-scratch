sources = ["bishop:3", "mml:9"]
deliverable = "math/prml/03-linear-regression"
build = [
  "basis-function regression; MLE and regularised least squares",
  "Bayesian linear regression: posterior over weights, predictive distribution",
  "evidence approximation to choose alpha and beta",
]
accept = [
  "the predictive variance grows away from the training data",
  "evidence maximisation picks a model complexity close to the true one on synthetic data",
]
limit_cases = ["more basis functions than data points: MLE ill-posed, Bayesian posterior well defined"]
status = "todo"

[[node]]
id = "prml-04-linear-classification"
title = "Linear models for classification"
track = "prml"
requires = ["prml-03-linear-regression", "foundations-06-optimization"]
sources = ["bishop:4"]
