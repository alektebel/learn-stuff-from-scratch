id = "t06-slugify"
title = "Add slugify to text utils"
category = "feature"
targets = ["baseline"]
statement = """
Add `slugify(text: str, max_len: int = 50) -> str` to `textutils.py`, with tests in
`tests/test_textutils.py`. Rules: strip accents (é -> e, ñ -> n; use unicodedata NFKD and
drop combining marks), lowercase, every run of characters that are not a-z or 0-9 becomes a
single "-", no leading or trailing "-". If the result is longer than max_len, cut it at
max_len and then remove any trailing "-". An input with no usable characters gives "".
"""
