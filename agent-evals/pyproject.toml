[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.0.0"
requires-python = ">=3.12"
# harness-lab is a sibling directory, installed alongside: pip install -e ../harness-lab -e .
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
include = ["redteam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: needs a running Docker daemon and the sandbox image"]
